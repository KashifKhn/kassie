syntax = "proto3";

package kassie.v1;

import "google/api/annotations.proto";

option go_package = "github.com/KashifKhn/kassie/api/gen/go;kassiev1";

service SessionService {
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/api/v1/session/login"
      body: "*"
    };
  }

  rpc Refresh(RefreshRequest) returns (RefreshResponse) {
    option (google.api.http) = {
      post: "/api/v1/session/refresh"
      body: "*"
    };
  }

  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/api/v1/session/logout"
      body: "*"
    };
  }

  rpc GetProfiles(GetProfilesRequest) returns (GetProfilesResponse) {
    option (google.api.http) = {
      get: "/api/v1/profiles"
    };
  }

  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse) {
    option (google.api.http) = {
      get: "/api/v1/metrics"
    };
  }
}

message LoginRequest {
  string profile = 1;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_at = 3;
  ProfileInfo profile = 4;
}

message RefreshRequest {
  string refresh_token = 1;
}

message RefreshResponse {
  string access_token = 1;
  int64 expires_at = 2;
}

message LogoutRequest {}

message LogoutResponse {}

message GetProfilesRequest {}

message GetProfilesResponse {
  repeated ProfileInfo profiles = 1;
}

message ProfileInfo {
  string name = 1;
  repeated string hosts = 2;
  int32 port = 3;
  string keyspace = 4;
  bool ssl_enabled = 5;
}

service HistoryService {
  rpc ListQueryHistory(ListQueryHistoryRequest) returns (ListQueryHistoryResponse) {
    option (google.api.http) = {
      get: "/api/v1/history/queries"
    };
  }

  rpc ClearQueryHistory(ClearQueryHistoryRequest) returns (ClearQueryHistoryResponse) {
    option (google.api.http) = {
      post: "/api/v1/history/queries/clear"
      body: "*"
    };
  }

  rpc SaveQuery(SaveQueryRequest) returns (SaveQueryResponse) {
    option (google.api.http) = {
      post: "/api/v1/history/saved"
      body: "*"
    };
  }

  rpc ListSavedQueries(ListSavedQueriesRequest) returns (ListSavedQueriesResponse) {
    option (google.api.http) = {
      get: "/api/v1/history/saved"
    };
  }

  rpc DeleteSavedQuery(DeleteSavedQueryRequest) returns (DeleteSavedQueryResponse) {
    option (google.api.http) = {
      delete: "/api/v1/history/saved/{name}"
    };
  }

  rpc GetSlowQueries(GetSlowQueriesRequest) returns (GetSlowQueriesResponse) {
    option (google.api.http) = {
      get: "/api/v1/history/slow"
    };
  }
}

message SavedQuery {
  string name = 1;
  string cql = 2;
  int64 created_at = 3;
}

message QueryHistoryEntry {
  string cql = 1;
  int64 executed_at = 2;
  int64 latency_ms = 3;
}

message ListQueryHistoryRequest {
  int32 limit = 1;
}

message ListQueryHistoryResponse {
  repeated QueryHistoryEntry entries = 1;
}

message ClearQueryHistoryRequest {}

message ClearQueryHistoryResponse {
  bool cleared = 1;
}

message SaveQueryRequest {
  string name = 1;
  string cql = 2;
}

message SaveQueryResponse {
  SavedQuery query = 1;
}

message ListSavedQueriesRequest {}

message ListSavedQueriesResponse {
  repeated SavedQuery queries = 1;
}

message DeleteSavedQueryRequest {
  string name = 1;
}

message SlowQuery {
  string cql = 1;
  int64 last_latency_ms = 2;
  int64 avg_latency_ms = 3;
  int64 max_latency_ms = 4;
  int64 exec_count = 5;
  int64 last_executed_at = 6;
}

message GetSlowQueriesRequest {
  int32 limit = 1;
}

message GetSlowQueriesResponse {
  repeated SlowQuery queries = 1;
}

message DeleteSavedQueryResponse {
  bool deleted = 1;
}

message GetMetricsRequest {}

message Metrics {
  int64 active_sessions = 1;
  int64 active_cursors = 2;
  int64 uptime_seconds = 3;
}

message GetMetricsResponse {
  Metrics metrics = 1;
}
