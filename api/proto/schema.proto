syntax = "proto3";

package kassie.v1;

import "google/api/annotations.proto";
import "common.proto";

option go_package = "github.com/KashifKhn/kassie/api/gen/go;kassiev1";

service SchemaService {
  rpc ListKeyspaces(ListKeyspacesRequest) returns (ListKeyspacesResponse) {
    option (google.api.http) = {
      get: "/api/v1/schema/keyspaces"
    };
  }

  rpc ListTables(ListTablesRequest) returns (ListTablesResponse) {
    option (google.api.http) = {
      get: "/api/v1/schema/keyspaces/{keyspace}/tables"
    };
  }

  rpc GetTableSchema(GetTableSchemaRequest) returns (GetTableSchemaResponse) {
    option (google.api.http) = {
      get: "/api/v1/schema/keyspaces/{keyspace}/tables/{table}"
    };
  }

  rpc GetTableStats(GetTableStatsRequest) returns (GetTableStatsResponse) {
    option (google.api.http) = {
      post: "/api/v1/schema/stats"
      body: "*"
    };
  }

  rpc GetClusterInfo(GetClusterInfoRequest) returns (GetClusterInfoResponse) {
    option (google.api.http) = {
      post: "/api/v1/schema/cluster"
      body: "*"
    };
  }

  rpc AnalyzeKeyspace(AnalyzeKeyspaceRequest) returns (AnalyzeKeyspaceResponse) {
    option (google.api.http) = {
      post: "/api/v1/schema/analyze"
      body: "*"
    };
  }
}

message AnalyzeKeyspaceRequest {
  string keyspace = 1;
}

message AdvisorFinding {
  string severity = 1;
  string rule = 2;
  string table = 3;
  string message = 4;
  string remediation = 5;
}

message AnalyzeKeyspaceResponse {
  repeated AdvisorFinding findings = 1;
  int32 tables_analyzed = 2;
}

message GetClusterInfoRequest {}

message ClusterNode {
  string address = 1;
  string data_center = 2;
  string rack = 3;
  string release_version = 4;
  int32 token_count = 5;
  bool local = 6;
  string status = 7;
}

message GetClusterInfoResponse {
  repeated ClusterNode nodes = 1;
}

message GetTableStatsRequest {
  string keyspace = 1;
  string table = 2;
}

message TableStats {
  int64 row_count = 1;
  int64 mean_partition_size_bytes = 2;
  int64 max_partition_size_bytes = 3;
  bool estimate_available = 4;
}

message GetTableStatsResponse {
  TableStats stats = 1;
}

message ListKeyspacesRequest {}

message ListKeyspacesResponse {
  repeated Keyspace keyspaces = 1;
}

message ListTablesRequest {
  string keyspace = 1;
}

message ListTablesResponse {
  repeated Table tables = 1;
}

message GetTableSchemaRequest {
  string keyspace = 1;
  string table = 2;
}

message GetTableSchemaResponse {
  TableSchema schema = 1;
}

message Keyspace {
  string name = 1;
  string replication_strategy = 2;
  map<string, string> replication = 3;
}

message Table {
  string name = 1;
  string keyspace = 2;
  int64 estimated_rows = 3;
}

message TableSchema {
  string keyspace = 1;
  string table = 2;
  repeated Column columns = 3;
  repeated string partition_keys = 4;
  repeated string clustering_keys = 5;
}
